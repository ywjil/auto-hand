<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AI Hand Controller - Pro</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto:wght@300;400&display=swap" rel="stylesheet">
</head>
<body>
    <div id="app">
        <!-- Background Layers -->
        <div class="video-overlay-net"></div>
        <video id="webcam" autoplay playsinline muted></video>
        <canvas id="output_canvas"></canvas>

        <!-- UI Layers (Floating) -->
        <header class="glass">
            <h1>AI Controller</h1>
            <div id="gesture_status">모델 로딩 중...</div>
        </header>

        <main>
            <div class="side-panel glass">
                <div class="guide-item"><span class="icon">🖐️</span> <span class="txt">이동</span></div>
                <div class="guide-item"><span class="icon">✊</span> <span class="txt">좌클릭</span></div>
                <div class="guide-item"><span class="icon">☝️</span> <span class="txt">휠클릭</span></div>
                <div class="guide-item"><span class="icon">👍</span> <span class="txt">우클릭</span></div>
            </div>

            <div class="test-panel-wrapper">
                <div class="test-area glass">
                    <h3>Click Test Zone</h3>
                    <div class="button-grid">
                        <button class="test-btn left" onclick="alert('좌클릭(주먹) 성공!')">L-CLICK</button>
                        <button class="test-btn middle" onauxclick="if(event.button === 1) alert('휠클릭(검지) 성공!')">WHEEL</button>
                        <button class="test-btn right" oncontextmenu="event.preventDefault(); alert('우클릭(엄지) 성공!')">R-CLICK</button>
                    </div>
                </div>
            </div>
        </main>

        <!-- Virtual Cursor -->
        <div id="virtual_cursor">
            <div class="cursor-inner"></div>
            <div class="cursor-ring"></div>
            <div class="cursor-label">READY</div>
        </div>
    </div>

    <!-- MediaPipe Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision/vision_bundle.mjs" type="module"></script>
    <script type="module" src="script.js"></script>
</body>
</html>
